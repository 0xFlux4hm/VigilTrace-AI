[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aobh"
version = "1.0.0"
description = "Autonomous Orchestrated Bug Hunter — MCP server (48 tools), orchestration engine, RAG over disclosed reports, ATAP account lifecycle, WAF/reCAPTCHA triage, Burp Montoya bridge. AUTHORIZED SECURITY TESTING ONLY."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aobh = "aobh.tools.cli:main"
aobh-server = "aobh.tools.server:main"

[tool.setuptools.packages.find]
include = ["aobh*"]

[tool.setuptools.package-data]
"aobh.tools" = ["tools.json"]
"aobh.rag" = ["data/*", "index/*"]
